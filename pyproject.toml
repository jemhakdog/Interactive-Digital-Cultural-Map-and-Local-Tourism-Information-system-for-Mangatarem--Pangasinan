[project]
name = "mangatarem-cultural-map"
version = "0.0.1"
description = "Interactive Digital Cultural Map and Local Tourism Information System for Mangatarem, Pangasinan"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-login>=0.6.0",
    "flask-limiter>=3.5.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "werkzeug>=3.0.0",
    "google-auth>=2.0.0",
    "requests>=2.32.5",
    "flask-migrate>=4.1.0",
    "psycopg2-binary>=2.9.11",
    "pymysql>=1.1.2",
    "cryptography>=46.0.3",
    "supabase>=2.27.2",
    "psycopg2>=2.9.11",
    "pillow>=12.1.0",
    "python-docx>=1.2.0",
    "flaskwebgui>=1.1.8",
    "waitress>=3.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

