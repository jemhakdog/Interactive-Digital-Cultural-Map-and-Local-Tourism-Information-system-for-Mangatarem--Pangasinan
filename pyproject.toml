[project]
name = "mangatarem-cultural-map"
version = "0.1.0"
description = "Interactive Digital Cultural Map and Local Tourism Information System for Mangatarem, Pangasinan"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "flask-sqlalchemy",
    "flask-login",
    "flask-limiter",
    "flask-migrate",
    "flask-wtf",
    "python-dotenv",
    "upstash-redis",
    "supabase",
    "bleach",
    "psycopg2-binary",
    "google-auth",
    "email-validator",
    "werkzeug",
    "pillow",
    "python-docx",
    "gunicorn",
    "requests",
    "httpx",
]

[tool.uv]
managed = true
package = false
