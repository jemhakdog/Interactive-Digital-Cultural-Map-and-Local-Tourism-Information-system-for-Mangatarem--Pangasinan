[project]
name = "mangatarem-cultural-map"
version = "0.0.1"
description = "Interactive Digital Cultural Map and Local Tourism Information System for Mangatarem, Pangasinan"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-login>=0.6.0",
    "flask-limiter>=3.5.0",
    "email-validator>=2.0.0",
    "pocketbase>=0.15.0",
    "python-dotenv>=1.0.0",
    "werkzeug>=3.0.0",
    "google-auth>=2.0.0",
    "requests>=2.32.5",
]

[tool.uv]
package = false

