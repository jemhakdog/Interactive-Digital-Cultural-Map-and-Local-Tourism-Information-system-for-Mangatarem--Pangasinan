<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #2d5016 0%, #4a7c23 100%); color: white; padding: 30px; text-align: center; border-radius: 10px 10px 0 0; }
        .content { background: #f9f9f9; padding: 30px; border: 1px solid #ddd; }
        .button { display: inline-block; background: #4a7c23; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; margin: 20px 0; }
        .footer { text-align: center; padding: 20px; color: #666; font-size: 12px; }
        .unsubscribe { color: #999; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ subject }}</h1>
    </div>
    <div class="content">
        {{ content | safe }}
        
        {% if cta_url %}
        <p style="text-align: center;">
            <a href="{{ cta_url }}" class="button">{{ cta_text | default('Learn More') }}</a>
        </p>
        {% endif %}
    </div>
    <div class="footer">
        <p>You're receiving this because you subscribed to our newsletter.</p>
        <p><a href="{{ unsubscribe_url }}" class="unsubscribe">Unsubscribe</a></p>
    </div>
</body>
</html>
