<!-- Visit Log Modal -->
<div id="visit-modal" class="fixed inset-0 z-[100] flex items-center justify-center hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-sky-950/60 backdrop-blur-sm transition-opacity" id="visit-modal-backdrop"></div>
    
    <!-- Modal Content -->
    <div class="relative bg-white rounded-[2.5rem] w-full max-w-lg mx-4 shadow-2xl border border-sky-900/5 overflow-hidden transform transition-all scale-95 opacity-0" id="visit-modal-content">
        <div class="p-8 md:p-10">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h3 class="text-2xl font-cultural font-bold text-sky-950">Record Your Journey</h3>
                    <p class="text-xs font-bold text-sky-900/40 uppercase tracking-widest mt-1">Log this visit to your discovery history</p>
                </div>
                <button id="close-visit-modal" class="w-10 h-10 rounded-full bg-sky-50 flex items-center justify-center text-sky-900/40 hover:text-sky-900 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <form id="visit-form" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="visit-target-id" name="target_id">
                <input type="hidden" id="visit-target-type" name="target_type">
                
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-sky-900/50 uppercase tracking-widest">Visit Date</label>
                    <input type="date" id="visit-date" name="visit_date" required
                        class="w-full bg-sky-50 border border-sky-900/5 rounded-2xl px-6 py-4 text-sky-950 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-sky-900/50 uppercase tracking-widest">Personal Notes <span class="normal-case font-medium opacity-60">(optional)</span></label>
                    <textarea id="visit-notes" name="notes" rows="4"
                        class="w-full bg-sky-50 border border-sky-900/5 rounded-2xl px-6 py-4 text-sky-950 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 transition-all resize-none"
                        placeholder="What was memorable about this visit?"></textarea>
                </div>

                <div id="visit-feedback" class="hidden text-sm font-bold text-center"></div>

                <button type="submit" id="submit-visit"
                    class="w-full bg-sky-600 text-white font-bold py-5 px-8 rounded-[2rem] hover:bg-sky-500 transition-all duration-300 shadow-lg shadow-sky-600/20 flex items-center justify-center gap-3">
                    <span id="submit-visit-text">Log this Visit</span>
                    <div id="submit-visit-spinner" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin hidden"></div>
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    #visit-modal.active { display: flex; }
    #visit-modal.active #visit-modal-content {
        transform: scale(1);
        opacity: 1;
    }
</style>
