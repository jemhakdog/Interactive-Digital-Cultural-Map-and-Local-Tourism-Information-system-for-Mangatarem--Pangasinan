{% extends "base.html" %}

{% block title %}Log Visitor - {{ target_name }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="mb-8">
            <a href="{{ url_for('business.dashboard') if target_type == 'establishment' else url_for('barangay.barangay_dashboard') }}" 
               class="text-blue-600 hover:text-blue-800 flex items-center mb-4 transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Record Visitor</h1>
            <p class="text-gray-800 dark:text-gray-600 mt-2">Logging visit for: <span class="font-semibold text-blue-600">{{ target_name }}</span></p>
        </div>

        <!-- Form Card -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 overflow-hidden">
            <form action="{{ url_for('analytics_module.log_visitor', target_type=target_type, target_id=target_id) }}" method="POST" class="p-8 space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <!-- System User Toggle -->
                <div class="flex items-center justify-between p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-100 dark:border-blue-800">
                    <div>
                        <h3 class="text-sm font-semibold text-blue-900 dark:text-blue-300">Is this a registered platform user?</h3>
                        <p class="text-xs text-blue-700 dark:text-blue-400">Enable this to search for existing accounts.</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="systemUserToggle" name="is_system_user" value="true" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-400 after:border after:rounded-full after:h-5 after:width-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                    </label>
                </div>

                <!-- User Search (Visible only if System User is ON) -->
                <div id="userSearchSection" class="hidden space-y-4 animate-in fade-in slide-in-from-top-2 duration-300">
                    <label for="userSearch" class="block text-sm font-medium text-gray-900 dark:text-gray-300">Search User (Username or Email)</label>
                    <div class="relative">
                        <input type="text" id="userSearch" class="w-full px-4 py-3 rounded-xl border border-gray-400 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Type at least 2 characters...">
                        <div id="searchResults" class="absolute z-10 w-full mt-2 bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-100 dark:border-gray-700 hidden">
                            <!-- Results will be injected here -->
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Name -->
                    <div class="space-y-2">
                        <label for="visitor_name" class="block text-sm font-medium text-gray-900 dark:text-gray-300">Visitor Full Name</label>
                        <input type="text" name="visitor_name" id="visitor_name" required 
                               class="w-full px-4 py-3 rounded-xl border border-gray-400 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>

                    <!-- Age -->
                    <div class="space-y-2">
                        <label for="visitor_age" class="block text-sm font-medium text-gray-900 dark:text-gray-300">Age</label>
                        <input type="number" name="visitor_age" id="visitor_age" 
                               class="w-full px-4 py-3 rounded-xl border border-gray-400 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                </div>

                <!-- Origin/Address -->
                <div class="space-y-2">
                    <label for="visitor_address" class="block text-sm font-medium text-gray-900 dark:text-gray-300">Origin / Address</label>
                    <input type="text" name="visitor_address" id="visitor_address" 
                           class="w-full px-4 py-3 rounded-xl border border-gray-400 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all" 
                           placeholder="e.g., Barangay Pob, Mangatarem">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Visitor Count -->
                    <div class="space-y-2">
                        <label for="visitor_count" class="block text-sm font-medium text-gray-900 dark:text-gray-300">Visitor Count (Group Size)</label>
                        <input type="number" name="visitor_count" id="visitor_count" value="1" min="1" 
                               class="w-full px-4 py-3 rounded-xl border border-gray-400 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                    
                    <!-- Date (Readonly for record accuracy) -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-900 dark:text-gray-300">Record Date</label>
                        <input type="text" value="{{ now().strftime('%B %d, %Y') }}" readonly 
                               class="w-full px-4 py-3 rounded-xl border border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 text-gray-700 cursor-not-allowed">
                    </div>
                </div>

                <!-- Notes -->
                <div class="space-y-2">
                    <label for="notes" class="block text-sm font-medium text-gray-900 dark:text-gray-300">Additional Notes</label>
                    <textarea name="notes" id="notes" rows="3" 
                              class="w-full px-4 py-3 rounded-xl border border-gray-400 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all" 
                              placeholder="Any specific comments or observations..."></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-blue-500/30 transform transition-all active:scale-95 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                    </svg>
                    Save Visitor Record
                </button>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.getElementById('systemUserToggle');
    const searchSection = document.getElementById('userSearchSection');
    const searchInput = document.getElementById('userSearch');
    const resultsDiv = document.getElementById('searchResults');
    const nameInput = document.getElementById('visitor_name');
    const addressInput = document.getElementById('visitor_address');

    // Toggle Visibility
    toggle.addEventListener('change', function() {
        if (this.checked) {
            searchSection.classList.remove('hidden');
        } else {
            searchSection.classList.add('hidden');
        }
    });

    // Search Logic
    let debounceTimer;
    searchInput.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        const query = this.value.trim();
        
        if (query.length < 2) {
            resultsDiv.classList.add('hidden');
            return;
        }

        debounceTimer = setTimeout(() => {
            fetch(`/auth/api/users/search?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    resultsDiv.innerHTML = '';
                    if (data.length > 0) {
                        data.forEach(user => {
                            const div = document.createElement('div');
                            div.className = 'p-4 hover:bg-blue-50 dark:hover:bg-blue-900/30 cursor-pointer border-b border-gray-100 dark:border-gray-700 last:border-0 transition-colors';
                            div.innerHTML = `
                                <div class="font-bold dark:text-white">${user.username}</div>
                                <div class="text-xs text-gray-700 dark:text-gray-600">${user.email} • ${user.barangay}</div>
                            `;
                            div.addEventListener('click', () => {
                                nameInput.value = user.username;
                                addressInput.value = user.barangay;
                                searchInput.value = user.username;
                                resultsDiv.classList.add('hidden');
                            });
                            resultsDiv.appendChild(div);
                        });
                        resultsDiv.classList.remove('hidden');
                    } else {
                        resultsDiv.innerHTML = '<div class="p-4 text-gray-700 text-sm italic">No users found.</div>';
                        resultsDiv.classList.remove('hidden');
                    }
                });
        }, 300);
    });

    // Close results when clicking outside
    document.addEventListener('click', function(e) {
        if (!searchSection.contains(e.target)) {
            resultsDiv.classList.add('hidden');
        }
    });
});
</script>
{% endblock %}
