{% extends 'base.html' %}

{% block title %}Add Attraction - Barangay Hub{% endblock %}

{% block content %}
<div class="min-h-screen bg-[#f8fafc] py-12 px-6">
    <div class="container mx-auto max-w-3xl">
        <!-- Header -->
        <div class="mb-8">
            <a href="{{ url_for('barangay.barangay_dashboard') }}" class="text-emerald-600 hover:text-emerald-700 font-bold flex items-center gap-2 mb-4 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-3xl font-black text-emerald-950">New Attraction Submission</h1>
            <p class="text-emerald-900/60 font-medium">Contribute a new cultural landmark for validation.</p>
        </div>

        <!-- Form -->
        <div class="bg-white rounded-[2rem] shadow-xl shadow-emerald-900/5 p-8 md:p-12 border border-emerald-900/5">
            <form action="{{ url_for('barangay.barangay_add_attraction') }}" method="POST" enctype="multipart/form-data" class="space-y-8">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Name -->
                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-black text-emerald-900/50 uppercase tracking-widest mb-2 ml-1">Attraction Name</label>
                        <input type="text" name="name" required placeholder="Name of the site"
                            class="w-full px-5 py-4 rounded-2xl bg-emerald-50/50 border border-emerald-900/10 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 transition-all text-emerald-950 font-bold outline-none">
                    </div>

                    <!-- Category -->
                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-black text-emerald-900/50 uppercase tracking-widest mb-2 ml-1">Category</label>
                        <select name="category" required
                            class="w-full px-5 py-4 rounded-2xl bg-emerald-50/50 border border-emerald-900/10 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 transition-all text-emerald-950 font-bold outline-none cursor-pointer">
                            <option value="Nature">Nature & Parks</option>
                            <option value="Historical">Historical Landmark</option>
                            <option value="Religious">Religious Site</option>
                            <option value="Adventure">Adventure & Recreation</option>
                            <option value="Culture">Cultural Center</option>
                        </select>
                    </div>

                    <!-- Description -->
                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-black text-emerald-900/50 uppercase tracking-widest mb-2 ml-1">Narrative Description</label>
                        <textarea name="description" rows="5" required placeholder="Detailed history or description..."
                            class="w-full px-5 py-4 rounded-2xl bg-emerald-50/50 border border-emerald-900/10 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 transition-all text-emerald-950 font-bold outline-none resize-none"></textarea>
                    </div>

                    <!-- Coordinates -->
                    <div>
                        <label class="block text-[10px] font-black text-emerald-900/50 uppercase tracking-widest mb-2 ml-1">Latitude</label>
                        <input type="number" step="any" name="latitude" required placeholder="15.7xxx"
                            class="w-full px-5 py-4 rounded-2xl bg-emerald-50/50 border border-emerald-900/10 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 transition-all text-emerald-950 font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-emerald-900/50 uppercase tracking-widest mb-2 ml-1">Longitude</label>
                        <input type="number" step="any" name="longitude" required placeholder="120.2xxx"
                            class="w-full px-5 py-4 rounded-2xl bg-emerald-50/50 border border-emerald-900/10 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 transition-all text-emerald-950 font-bold outline-none">
                    </div>

                    <!-- Media -->
                    <div class="md:col-span-2 p-6 bg-emerald-50 rounded-[1.5rem] border border-emerald-900/5">
                        <h4 class="text-xs font-black text-emerald-900/70 uppercase tracking-widest mb-6 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            Visual Media
                        </h4>
                        
                        <div class="space-y-6">
                            <div>
                                <label class="block text-[10px] font-black text-emerald-900/40 uppercase tracking-widest mb-2 ml-1">File Upload</label>
                                <input type="file" name="image" accept="image/*"
                                    class="w-full text-xs text-emerald-950 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-[10px] file:font-black file:uppercase file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer">
                            </div>
                            
                            <div class="flex items-center gap-4">
                                <div class="flex-grow border-t border-emerald-900/10"></div>
                                <span class="text-[10px] font-black text-emerald-900/20 uppercase tracking-widest whitespace-nowrap">OR</span>
                                <div class="flex-grow border-t border-emerald-900/10"></div>
                            </div>

                            <div>
                                <label class="block text-[10px] font-black text-emerald-900/40 uppercase tracking-widest mb-2 ml-1">Asset URL</label>
                                <input type="url" name="image_url" placeholder="https://..."
                                    class="w-full px-5 py-4 rounded-2xl bg-white border border-emerald-900/10 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all text-emerald-950 font-bold outline-none">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-end gap-4 pt-6">
                    <a href="{{ url_for('barangay.barangay_dashboard') }}" class="px-8 py-4 text-sm font-black text-emerald-900/40 hover:text-emerald-900 uppercase tracking-widest transition-all text-center">
                        Discard
                    </a>
                    <button type="submit" class="px-10 py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl text-sm font-black uppercase tracking-widest transition-all shadow-xl shadow-emerald-600/20">
                        Submit for Validation
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
