name = "mangatarem-cultural-map"
main = "app.py"
compatibility_date = "2024-04-03"
compatibility_flags = ["python_workers"]

[vars]
# Non-sensitive environment variables
FLASK_ENV = "production"
DB_PROVIDER = "supabase"
IS_CLOUDFLARE_WORKER = "true"

# Assets configuration for static files (CSS, JS, Images)
# This allows Cloudflare to serve your static/ folder directly from the edge
[[assets]]
directory = "./static"
binding = "ASSETS"

# Build configuration to ensure tailwind and terser run during deployment
[build]
command = "npm run build"
watch_dir = "static"
